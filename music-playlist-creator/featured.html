<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Featured Playlist - Music Playlist Explorer</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Music Playlist Explorer</h1>
            <nav class="page-nav" aria-label="Main navigation">
                <a href="featured.html" class="nav-link active" aria-current="page">Featured</a>
                <a href="index.html" class="nav-link">All Playlists</a>
            </nav>
        </div>
    </header>

    <main class="featured-main">
        <div class="featured-container">
            <!-- Left Column: Playlist Cover & Info -->
            <section class="featured-left" aria-labelledby="featured-playlist-title">
                <div class="featured-image-container">
                    <img class="featured-playlist-image" src="assets/img/playlist.png" alt="">
                </div>
                <div class="featured-info">
                    <h2 class="featured-playlist-title" id="featured-playlist-title">Loading...</h2>
                    <p class="featured-playlist-creator">Creator</p>
                    <div class="featured-playlist-meta">
                        <div class="featured-likes">
                            <span class="like-icon" role="button" tabindex="0" aria-label="Like this playlist">♥</span>
                            <span class="like-count">0</span>
                        </div>
                        <div class="featured-song-count">
                            <span class="song-count-number">0</span> songs
                        </div>
                    </div>
                </div>
            </section>

            <!-- Right Column: Song List -->
            <section class="featured-right" aria-label="Playlist songs">
                <div class="featured-songs-header">
                    <h3>Tracklist</h3>
                    <button class="shuffle-button-featured">🔀 Shuffle</button>
                </div>
                <div class="featured-songs">
                    <!-- Songs will be dynamically generated by JavaScript -->
                    <p class="loading-message">Loading playlist...</p>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Music Playlist Explorer</p>
    </footer>

    <script src="featured.js"></script>
</body>
</html>
