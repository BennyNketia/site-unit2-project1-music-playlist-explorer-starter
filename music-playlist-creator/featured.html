<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Featured Playlist - Music Playlist Explorer</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Music Playlist Explorer</h1>
            <nav class="page-nav" aria-label="Main navigation">
                <a href="featured.html" class="nav-link active" aria-current="page">Featured</a>
                <a href="index.html" class="nav-link">All Playlists</a>
            </nav>
        </div>
    </header>

    <main class="featured-main">
        <div class="featured-container">
            <!-- Left Column: Playlist Cover & Info -->
            <section class="featured-left" aria-labelledby="featured-playlist-title">
                <div class="featured-image-container">
                    <img class="featured-playlist-image" src="assets/img/playlist.png" alt="">
                </div>
                <div class="featured-info">
                    <h2 class="featured-playlist-title" id="featured-playlist-title">Loading...</h2>
                    <p class="featured-playlist-creator">Creator</p>
                    <div class="featured-playlist-meta">
                        <div class="featured-likes">
                            <span class="like-icon" role="button" tabindex="0" aria-label="Like this playlist">♥</span>
                            <span class="like-count">0</span>
                        </div>
                        <div class="featured-song-count">
                            <span class="song-count-number">0</span> songs
                        </div>
                    </div>
                </div>
            </section>

            <!-- Right Column: Song List -->
            <section class="featured-right" aria-label="Playlist songs">
                <div class="featured-songs-header">
                    <h3>Tracklist</h3>
                    <button class="shuffle-button-featured">🔀 Shuffle</button>
                </div>
                <div class="featured-songs">
                    <!-- Songs will be dynamically generated by JavaScript -->
                    <p class="loading-message">Loading playlist...</p>
                </div>
            </section>
        </div>
    </main>

    <!-- Music Player Bar (Fixed at Bottom) -->
    <div class="music-player-bar" style="display: none;" role="region" aria-label="Now playing">
        <div class="player-song-info">
            <img class="player-thumbnail" src="assets/img/song.png" alt="">
            <div class="player-text">
                <h4 class="player-song-title">Song Title</h4>
                <p class="player-song-artist">Artist Name</p>
            </div>
        </div>
        <div class="player-controls">
            <button class="player-button player-prev" aria-label="Previous song">⏮</button>
            <button class="player-button player-play-pause" aria-label="Play/Pause">▶</button>
            <button class="player-button player-next" aria-label="Next song">⏭</button>
        </div>
        <div class="player-progress-container">
            <span class="player-current-time">0:00</span>
            <div class="player-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="player-progress-fill"></div>
                <div class="player-progress-handle"></div>
            </div>
            <span class="player-total-time">0:00</span>
        </div>
        <div class="player-extra">
            <button class="player-close" aria-label="Close player">&times;</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Music Playlist Explorer</p>
    </footer>

    <script src="featured.js"></script>
</body>
</html>
