<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Music Playlist Explorer</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Music Playlist Explorer</h1>
            <div class="header-actions">
                <nav class="page-nav" aria-label="Main navigation">
                    <a href="featured.html" class="nav-link">Featured</a>
                    <a href="index.html" class="nav-link active" aria-current="page">All Playlists</a>
                </nav>
                <button class="create-playlist-button" aria-label="Create new playlist">
                    <span class="button-icon">+</span> Create Playlist
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="playlist-gallery" aria-label="Playlist collection">
            <div class="playlist-cards" role="list">
                <!-- Playlist cards will be dynamically generated by JavaScript -->
            </div>
        </section>
    </main>

    <!-- Modal Overlay -->
    <div class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close modal">&times;</button>

            <div class="modal-header">
                <img class="modal-playlist-image" src="https://via.placeholder.com/150" alt="">
                <div class="modal-playlist-info">
                    <h2 class="modal-playlist-title" id="modal-title">Playlist Title</h2>
                    <p class="modal-playlist-creator">Creator Name</p>
                </div>
            </div>

            <div class="modal-songs">
                <!-- Song 1 -->
                <article class="song-item">
                    <img class="song-thumbnail" src="https://via.placeholder.com/60" alt="">
                    <div class="song-details">
                        <h3 class="song-title">Song Title</h3>
                        <p class="song-artist">Artist Name</p>
                        <p class="song-album">Album Name</p>
                    </div>
                    <span class="song-duration">0:00</span>
                    <button class="song-like-button" aria-label="Like this song">♥</button>
                </article>

                <!-- Song 2 -->
                <article class="song-item">
                    <img class="song-thumbnail" src="https://via.placeholder.com/60" alt="">
                    <div class="song-details">
                        <h3 class="song-title">Another Song</h3>
                        <p class="song-artist">Artist Name</p>
                        <p class="song-album">Album Name</p>
                    </div>
                    <span class="song-duration">0:00</span>
                    <button class="song-like-button" aria-label="Like this song">♥</button>
                </article>

                <!-- Song 3 -->
                <article class="song-item">
                    <img class="song-thumbnail" src="https://via.placeholder.com/60" alt="">
                    <div class="song-details">
                        <h3 class="song-title">Third Track</h3>
                        <p class="song-artist">Artist Name</p>
                        <p class="song-album">Album Name</p>
                    </div>
                    <span class="song-duration">0:00</span>
                    <button class="song-like-button" aria-label="Like this song">♥</button>
                </article>
            </div>

            <!-- AI Description Section -->
            <div class="modal-description-section">
                <button class="get-description-button">✨ Get AI Description</button>
                <div class="playlist-description" style="display: none;"></div>
            </div>

            <div class="modal-actions">
                <button class="shuffle-button">🔀 Shuffle Playlist</button>
            </div>
        </div>
    </div>

    <!-- Create Playlist Modal -->
    <div class="create-modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="create-modal-title">
        <div class="create-modal-content">
            <button class="modal-close create-modal-close" aria-label="Close create playlist form">&times;</button>

            <h2 id="create-modal-title">Create New Playlist</h2>

            <form id="create-playlist-form" class="create-playlist-form">
                <!-- Playlist Details -->
                <div class="form-section">
                    <h3>Playlist Details</h3>

                    <div class="form-group">
                        <label for="playlist-name">Playlist Name <span class="required">*</span></label>
                        <input
                            type="text"
                            id="playlist-name"
                            name="playlistName"
                            maxlength="100"
                            required
                            placeholder="e.g., Summer Vibes"
                            aria-required="true">
                    </div>

                    <div class="form-group">
                        <label for="creator-name">Creator Name <span class="required">*</span></label>
                        <input
                            type="text"
                            id="creator-name"
                            name="creatorName"
                            maxlength="50"
                            required
                            placeholder="e.g., DJ Cool"
                            aria-required="true">
                    </div>
                </div>

                <!-- Songs Section -->
                <div class="form-section">
                    <div class="section-header">
                        <h3>Songs <span class="required">*</span></h3>
                        <button type="button" class="add-song-button" aria-label="Add another song">
                            <span class="button-icon">+</span> Add Song
                        </button>
                    </div>

                    <div id="songs-container" class="songs-container">
                        <!-- Song fields will be dynamically added here -->
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <button type="button" class="cancel-button">Cancel</button>
                    <button type="submit" class="submit-button">Create Playlist</button>
                </div>

                <!-- Error Messages -->
                <div class="form-errors" style="display: none;"></div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Music Playlist Explorer</p>
    </footer>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
